services:
  postgres:
    container_name: postgres
    image: postgres:16.8-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_USER=nakama
      - POSTGRES_PASSWORD=localdb
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nakama"]
      interval: 10s
      timeout: 5s
      retries: 5

  nakama:
    container_name: nakama
    image: echotools/nakama:latest
    environment:
      - DATABASE_URL=postgres://nakama:localdb@postgres:5432/nakama
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
          /nakama/nakama migrate up --database.address "$${DATABASE_URL}" &&
          exec /nakama/nakama --name nakama1 --database.address "$${DATABASE_URL}" --logger.level DEBUG --session.token_expiry_sec 7200
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/nakama/data
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  evr-gateway:
    container_name: evr-gateway
    build:
      context: ./evr_gateway
      dockerfile: Dockerfile
    ports:
      - "7360:7360"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7360/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  data:
